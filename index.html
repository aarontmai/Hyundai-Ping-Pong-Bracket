<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ping Pong Tournament Bracket</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002c5f; --sky:#00aad2; --sand:#e4dcd3; --bg:#f6f3f2;
    --ink:#0b1f3a; --muted:#8a96a8; --line:#c9d2de;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden}

  /* Minimal ping pong backdrop: faint table outline, center line, net, a ball and its arc */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg svg{width:100%;height:100%}

  header{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding:36px 24px 8px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--sky);margin:0 0 6px}
  h1{margin:0;font-weight:300;font-size:clamp(26px,4.5vw,40px);letter-spacing:-.5px;color:var(--navy)}
  h1 b{font-weight:700}
  .controls{display:flex;gap:8px}
  button{font:500 12px Inter,sans-serif;letter-spacing:.5px;border:1px solid var(--navy);background:transparent;color:var(--navy);
    padding:8px 14px;border-radius:2px;cursor:pointer}
  button:hover{background:var(--navy);color:#fff}
  .rule{position:relative;z-index:2;max-width:1400px;margin:14px auto 0;padding:0 24px}
  .rule div{height:2px;background:linear-gradient(90deg,var(--navy) 0 64px,var(--line) 64px)}
  .hint{position:relative;z-index:2;max-width:1400px;margin:10px auto 0;padding:0 24px;font-size:12px;color:var(--muted)}

  .scroller{position:relative;z-index:2;overflow-x:auto;padding:18px 24px 48px;-webkit-overflow-scrolling:touch}
  .bracket{position:relative;display:flex;gap:26px;min-width:1180px;max-width:1400px;margin:0 auto;min-height:720px}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .round{flex:1;display:flex;flex-direction:column;min-width:150px}
  .round.right h2{text-align:right}
  .round.center h2{text-align:center}
  .round.center{min-width:180px}
  .round h2{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .slots{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:16px}
  .slots.abs{position:relative;display:block}
  .slots.abs .match{position:absolute;left:0;right:0}

  .match{background:#fff;border:1px solid var(--line);position:relative}
  .match::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--navy)}
  .team{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;font-size:13px}
  .team + .team{border-top:1px solid #eef1f5}
  .seed{width:16px;font-size:10px;font-weight:600;color:var(--muted);text-align:right;flex:0 0 16px}
  .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  input.name{border:0;outline:0;background:transparent;font:500 13px Inter,sans-serif;color:var(--ink);padding:0;height:100%}
  input.name::placeholder{color:#c3cbd6;font-weight:400}
  input.name:focus{box-shadow:inset 0 -2px 0 var(--sky)}
  .adv{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;padding:0}
  .adv:hover{border-color:var(--sky);background:#fff}
  .team.win .adv{background:var(--sky);border-color:var(--sky)}
  .team.win{background:#f0f9fc}
  .team.win .name{color:var(--navy);font-weight:700}
  .team.lose .name{color:#b5bfcc}
  .team.tbd .name{color:#c3cbd6;font-weight:400}
  .team.tbd .adv,.team.wait .adv{visibility:hidden}
  .right .match::before{left:auto;right:-1px}
  .right .team{flex-direction:row-reverse;padding:0 12px 0 10px}
  .right .seed{text-align:left}
  .right .name,.right input.name{text-align:right}
  .center .match::before{width:100%;height:3px;bottom:auto;left:0;top:-1px}
  .center .slots{justify-content:center;gap:22px}

  .champ{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
  .champ .label{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--sky)}
  .champ .cname{font-size:22px;font-weight:300;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:6px;min-width:170px;min-height:36px;text-align:center}
  .champ .cname.set{font-weight:700}
  .champ svg{width:44px;height:44px}
  .champ .emblems{display:flex;align-items:center;gap:14px}
  .champ .pp-logo{width:52px;height:52px}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-right:6px}
  .status i{width:7px;height:7px;border-radius:50%;background:#c9d2de;display:inline-block}
  .status.live i{background:#2bb673}.status.saving i{background:var(--sky)}.status.err i{background:#d64545}
  .controls{align-items:center;flex-wrap:wrap;justify-content:flex-end}
</style>
</head>
<body>
<div class="bg">
  <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
    <rect x="60" y="80" width="880" height="540" fill="none" stroke="#002c5f" stroke-opacity=".06" stroke-width="3"/>
    <line x1="60" y1="350" x2="940" y2="350" stroke="#002c5f" stroke-opacity=".05" stroke-width="2"/>
    <line x1="500" y1="70" x2="500" y2="630" stroke="#002c5f" stroke-opacity=".08" stroke-width="5"/>
    <path d="M150 560 Q 330 300 520 420 T 860 200" fill="none" stroke="#00aad2" stroke-opacity=".18" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="860" cy="200" r="10" fill="#00aad2" fill-opacity=".22"/>
    <g transform="translate(110 600) rotate(-35)" opacity=".06"><circle r="42" fill="#002c5f"/><rect x="-9" y="36" width="18" height="56" rx="6" fill="#002c5f"/></g>
  </svg>
</div>

<header>
  <div>
    <p class="eyebrow">Hyundai · Table Tennis</p>
    <h1><b>Ping Pong</b> Tournament</h1>
  </div>
  <div class="controls">
    <span class="status" id="status"><i></i><span>Local</span></span>
    <button id="resetBtn">Reset results</button>
    <button id="clearBtn">Clear bracket</button>
  </div>
</header>
<div class="rule"><div></div></div>
<p class="hint" id="hint">Type team names in the Round of 16 · tap the circle next to a team to advance it · changes save for everyone</p>

<div class="scroller">
  <div class="bracket" id="bracket">
    <svg class="links" id="links"></svg>
    <div class="round"><h2>Round of 16</h2><div class="slots" id="L1"></div></div>
    <div class="round"><h2>Quarterfinals</h2><div class="slots abs" id="L2"></div></div>
    <div class="round"><h2>Semifinal</h2><div class="slots abs" id="L3"></div></div>
    <div class="round center"><h2>Final</h2><div class="slots" id="C">
      <div class="champ" id="champ">
        <div class="emblems">
          <svg class="pp-logo" viewBox="0 0 64 64" aria-label="Crossed ping pong paddles: Hyundai blue and Genesis brown" role="img">
            <!-- crossed paddles: handles cross below, heads spread apart -->
            <line x1="44" y1="30" x2="16" y2="58" stroke="#8a96a8" stroke-width="6" stroke-linecap="round"/>
            <line x1="20" y1="30" x2="48" y2="58" stroke="#8a96a8" stroke-width="6" stroke-linecap="round"/>
            <circle cx="18" cy="24" r="13" fill="#002c5f"><title>Hyundai</title></circle>
            <circle cx="46" cy="24" r="13" fill="#9a6b4f"><title>Genesis</title></circle>
            <!-- ball -->
            <circle cx="32" cy="8" r="5.5" fill="#fff" stroke="#002c5f" stroke-width="1.5"/>
          </svg>
          <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="none" stroke="#002c5f" stroke-width="1.5"/><circle cx="22" cy="22" r="7" fill="#00aad2"/></svg>
        </div>
        <div class="label">Champion</div>
        <div class="cname" id="champName"></div>
      </div>
      <div id="F"></div>
    </div></div>
    <div class="round right"><h2>Semifinal</h2><div class="slots abs" id="R3"></div></div>
    <div class="round right"><h2>Quarterfinals</h2><div class="slots abs" id="R2"></div></div>
    <div class="round right"><h2>Round of 16</h2><div class="slots" id="R1"></div></div>
  </div>
</div>


<script>
// ---- Shared storage: Firebase Realtime Database (REST). Leave blank for local-only mode. ----
const FIREBASE_DB = "https://ping-pong-61fee-default-rtdb.firebaseio.com";   // e.g. https://your-project-default-rtdb.firebaseio.com
// -------------------------------------------------------------------------------------------
const REMOTE=!!FIREBASE_DB;
const KEY="hy-pp-bracket-v3", N=16;
const blank=()=>({teams:Array(N).fill(""),w:{}});
// Firebase returns teams as an array or an object keyed "0".."15", with empty slots missing
const norm=d=>{const src=(d&&d.teams)||{},t=[];for(let i=0;i<N;i++){const v=src[i];t.push(v==null?"":String(v));}
  return{teams:t,w:(d&&d.w&&typeof d.w==="object")?d.w:{}};};
let state=blank();
try{state=norm(JSON.parse(localStorage.getItem(KEY)));}catch(e){}

// Tiny Firebase REST client. Resolves true/false for allowed/denied; rejects on network errors.
function fb(path,method,body){
  return fetch(FIREBASE_DB.replace(/\/$/,"")+"/"+path+".json",{method,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"})
    .then(r=>{ if(r.status===401||r.status===403||r.status===400) return false; if(!r.ok) throw new Error(r.status); return true; });
}
const api={
  get:()=>fetch(FIREBASE_DB.replace(/\/$/,"")+"/bracket.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}),
  name:(i,name)=>name?fb("bracket/teams/"+i,"PUT",name.slice(0,40)):fb("bracket/teams/"+i,"DELETE"),
  // only the matches that changed are sent, so two people advancing different games don't overwrite each other
  results:changes=>fb("bracket/w","PATCH",changes),
  resetResults:()=>fb("bracket/w","DELETE"),
  clear:()=>fb("bracket","DELETE"),
};
function setStatus(cls,text){const s=document.getElementById("status");s.className="status "+cls;s.querySelector("span").textContent=text;}

const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
let pendingNames=new Map(), nameTimer=null, resultsDirty=false, resultsTimer=null, inflight=0;
function busy(){return pendingNames.size>0||resultsDirty||inflight>0;}
function refreshStatus(){ if(busy()) setStatus("saving","Saving…"); else setStatus("live","Saved"); }

// Anyone can edit a team name: each slot is saved on its own so people don't overwrite each other
function saveName(i){
  cache(); if(!REMOTE)return;
  pendingNames.set(i,state.teams[i]); refreshStatus();
  clearTimeout(nameTimer); nameTimer=setTimeout(flushNames,600);
}
function flushNames(){
  const batch=[...pendingNames.entries()]; pendingNames.clear();
  batch.forEach(([i,name])=>{
    inflight++;
    api.name(i,name).then(ok=>{
      if(ok!==true) throw 0; inflight--; refreshStatus();
    }).catch(()=>{ inflight--; if(!pendingNames.has(i)) pendingNames.set(i,state.teams[i]); setStatus("err","Not saved – retrying"); clearTimeout(nameTimer); nameTimer=setTimeout(flushNames,3000); });
  });
}
// Results (who advanced): anyone can change them
let syncedW={};
const save=()=>{
  cache(); if(!REMOTE)return;
  resultsDirty=true; refreshStatus(); clearTimeout(resultsTimer); resultsTimer=setTimeout(pushResults,350);
};
function pushResults(){
  const changes={}, target=JSON.parse(JSON.stringify(state.w));
  new Set([...Object.keys(syncedW),...Object.keys(target)]).forEach(k=>{ if(syncedW[k]!==target[k]) changes[k]=target[k]===undefined?null:target[k]; });
  if(!Object.keys(changes).length){resultsDirty=false;refreshStatus();return;}
  const req=Object.keys(target).length?api.results(changes):api.resetResults();
  inflight++;
  req.then(ok=>{
    inflight--;
    if(ok!==true) throw 0;
    syncedW=target; if(JSON.stringify(target)===JSON.stringify(state.w)) resultsDirty=false; refreshStatus();
  }).catch(()=>{setStatus("err","Not saved – retrying");resultsTimer=setTimeout(pushResults,3000);});
}
function clearAll(){
  state={teams:Array(N).fill(""),w:{}}; pendingNames.clear(); clearTimeout(resultsTimer); resultsDirty=false; cache(); render();
  if(!REMOTE)return; inflight++; refreshStatus();
  api.clear().then(ok=>{inflight--; if(ok!==true) throw 0; syncedW={}; refreshStatus();})
    .catch(()=>{setStatus("err","Not cleared – try again");});
}
function pull(){
  if(!REMOTE)return;
  api.get().then(data=>{
    const inc=norm(data), a=document.activeElement;
    const focused=(a&&a.tagName==="INPUT"&&a.dataset.slot!=null)?+a.dataset.slot:null;
    if(!resultsDirty) syncedW=JSON.parse(JSON.stringify(inc.w));
    const next={teams:inc.teams.map((t,i)=>(pendingNames.has(i)||i===focused)?state.teams[i]:t), w:(resultsDirty?state.w:inc.w)};
    if(!busy()) setStatus("live","Live");
    if(JSON.stringify(next)===JSON.stringify(state))return;
    state=next; cache();
    // re-render without kicking someone out of the box they're typing in
    let sel=null; if(focused!=null){try{sel=[a.selectionStart,a.selectionEnd];}catch(e){}}
    render();
    if(focused!=null){const el=document.querySelector(`input[data-slot="${focused}"]`); if(el){el.focus(); if(sel)try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  }).catch(()=>{ if(!busy()) setStatus("err","Offline"); });
}

const M={
  a:{s:[{seed:1},{seed:2}]}, b:{s:[{seed:3},{seed:4}]}, c:{s:[{seed:5},{seed:6}]}, d:{s:[{seed:7},{seed:8}]},
  e:{s:[{seed:9},{seed:10}]}, f2:{s:[{seed:11},{seed:12}]}, g:{s:[{seed:13},{seed:14}]}, h:{s:[{seed:15},{seed:16}]},
  q1:{s:[{from:"a"},{from:"b"}]}, q2:{s:[{from:"c"},{from:"d"}]},
  q3:{s:[{from:"e"},{from:"f2"}]}, q4:{s:[{from:"g"},{from:"h"}]},
  s1:{s:[{from:"q1"},{from:"q2"}]}, s2:{s:[{from:"q3"},{from:"q4"}]}, f:{s:[{from:"s1"},{from:"s2"}]}
};
const order={L1:["a","b","c","d"],L2:["q1","q2"],L3:["s1"],F:["f"],R3:["s2"],R2:["q3","q4"],R1:["e","f2","g","h"]};
const ent=src=>src.seed||state.w[src.from]||null;
const label=n=>state.teams[n-1]||"Unnamed team";

function clearDown(id){
  for(const [mid,m] of Object.entries(M)){
    if(m.s.some(x=>x.from===id)&&state.w[mid]&&!m.s.map(ent).includes(state.w[mid])){delete state.w[mid];clearDown(mid);}
  }
}
function pick(id,seed){ if(state.w[id]===seed)delete state.w[id]; else state.w[id]=seed; clearDown(id); save(); render(); }

function row(id,src,i,ents){
  const seed=ent(src), w=state.w[id], ready=ents[0]&&ents[1];
  const r=document.createElement("div"); r.className="team";
  if(!seed){ r.classList.add("tbd"); r.innerHTML='<span class="name">—</span><button class="adv"></button>'; return r; }
  if(w) r.classList.add(w===seed?"win":"lose"); else if(!ready) r.classList.add("wait");
  r.innerHTML="";
  if(src.seed){ // editable entry slot – open to everyone
    const inp=document.createElement("input"); inp.className="name"; inp.placeholder="Team name"; inp.maxLength=30;
    inp.value=state.teams[seed-1];
    inp.dataset.slot=seed-1;
    inp.oninput=()=>{state.teams[seed-1]=inp.value; saveName(seed-1); syncNames(seed);};
    r.appendChild(inp);
  } else {
    const s=document.createElement("span"); s.className="name"; s.dataset.seed=seed; s.textContent=label(seed); r.appendChild(s);
  }
  const b=document.createElement("button"); b.className="adv"; b.title="Advance";
  if(ready) b.onclick=()=>pick(id,seed);
  r.appendChild(b); return r;
}
function syncNames(seed){
  document.querySelectorAll(`span.name[data-seed="${seed}"]`).forEach(el=>el.textContent=label(seed));
  updateChamp();
}
function updateChamp(){
  const c=state.w.f, el=document.getElementById("champName");
  el.textContent=c?label(c):""; el.classList.toggle("set",!!c);
}
function render(){
  for(const r of Object.keys(order)){
    const col=document.getElementById(r); col.innerHTML="";
    for(const id of order[r]){
      const m=M[id], el=document.createElement("div"); el.className="match"; el.id="m-"+id;
      const ents=m.s.map(ent);
      m.s.forEach((src,i)=>el.appendChild(row(id,src,i,ents)));
      col.appendChild(el);
    }
  }
  updateChamp(); layout(); requestAnimationFrame(links);
}
// Place each later-round match midway between the matches that feed it
const feeds={q1:["a","b"],q2:["c","d"],q3:["e","f2"],q4:["g","h"],s1:["q1","q2"],s2:["q3","q4"]};
function layout(){
  for(const col of ["L2","R2","L3","R3"]){
    const c=document.getElementById(col), top=c.getBoundingClientRect().top;
    for(const id of order[col]){
      const el=document.getElementById("m-"+id);
      const ys=feeds[id].map(f=>{const r=document.getElementById("m-"+f).getBoundingClientRect();return r.top+r.height/2;});
      const mid=ys.reduce((x,y)=>x+y,0)/ys.length;
      el.style.top=(mid-top-el.offsetHeight/2)+"px";
    }
  }
}
function links(){
  const box=document.getElementById("bracket").getBoundingClientRect(); let p="";
  for(const [id,m] of Object.entries(M)){
    const rows=document.getElementById("m-"+id).querySelectorAll(".team");
    m.s.forEach((src,i)=>{
      if(!src.from)return;
      const f=document.getElementById("m-"+src.from).getBoundingClientRect(), t=rows[i].getBoundingClientRect();
      const ltr=f.left<t.left;
      const x1=(ltr?f.right:f.left)-box.left,y1=f.top+f.height/2-box.top,x2=(ltr?t.left:t.right)-box.left,y2=t.top+t.height/2-box.top,mx=(x1+x2)/2;
      const on=!!state.w[src.from];
      p+=`<path d="M${x1} ${y1}H${mx}V${y2}H${x2}" fill="none" stroke="${on?'#00aad2':'#c9d2de'}" stroke-width="${on?2:1}"/>`;
    });
  }
  const f=document.getElementById("m-f").getBoundingClientRect(), c=document.getElementById("champName").getBoundingClientRect();
  p+=`<path d="M${f.left+f.width/2-box.left} ${f.top-box.top}V${c.bottom-box.top+4}" stroke="${state.w.f?'#00aad2':'#c9d2de'}" stroke-width="${state.w.f?2:1}" fill="none"/>`;
  document.getElementById("links").innerHTML=p;
}
addEventListener("resize",()=>{layout();links();});
if(document.fonts)document.fonts.ready.then(()=>{layout();links();});

function twoTap(btn,text,fn){let armed=false,t;btn.onclick=()=>{
  if(!armed){armed=true;btn.textContent="Tap again to confirm";t=setTimeout(()=>{armed=false;btn.textContent=text},2500);return;}
  clearTimeout(t);armed=false;btn.textContent=text;fn();}}
twoTap(document.getElementById("resetBtn"),"Reset results",()=>{state.w={};save();render();});
twoTap(document.getElementById("clearBtn"),"Clear bracket",clearAll);
if(REMOTE){
  setStatus("","Connecting…");
  pull(); setInterval(pull,3000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull();});
} else setStatus("","Local only");
render();
</script>
</body>
</html>
